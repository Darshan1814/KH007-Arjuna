apiVersion: apps/v1
kind: Deployment
metadata:
  name: gradpilot
  namespace: gradpilot
  labels:
    app: gradpilot
spec:
  # Initial replica count. The HPA below will scale this between 2 and 10
  # based on CPU and memory utilisation.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gradpilot
  template:
    metadata:
      labels:
        app: gradpilot
    spec:
      # Override at deploy time: image is set by Jenkins via `kubectl set image`.
      containers:
        - name: gradpilot
          image: darshan11111/gradpilot:latest
          # IfNotPresent works both for local kind (image is loaded via
          # `kind load docker-image`) and for production with a registry
          # (Jenkins always pushes a unique tag, so Kubernetes pulls it).
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: gradpilot-config
            - secretRef:
                name: gradpilot-secrets
          # Resource requests + limits drive the HPA decisions.
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      # Ensures pods don't pile up on the same node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gradpilot
